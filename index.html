<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIF-Amir | Persona Física | Fase 3</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0f172a;color:#e2e8f0;font-size:13px}
        
        /* NAV */
        .nav{display:flex;gap:4px;background:#1e293b;border-bottom:1px solid #334155;padding:8px 16px;overflow-x:auto;flex-wrap:wrap}
        .nav-btn{padding:7px 16px;border:none;border-radius:5px;cursor:pointer;font-size:13px;font-weight:600;background:transparent;color:#94a3b8;transition:all .15s;white-space:nowrap}
        .nav-btn:hover{background:#334155;color:#e2e8f0}
        .nav-btn.active{background:#3b82f6;color:#fff}
        
        /* VIEWS */
        .view{display:none;padding:20px}
        .view.active{display:block}
        
        /* HEADER */
        h1{padding:16px 20px 0;font-size:18px;color:#f1f5f9}
        .subtitle{padding:4px 20px 12px;color:#64748b;font-size:12px}
        
        /* CARDS */
        .card{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:18px;margin-bottom:16px}
        .card h3{margin-bottom:12px;color:#cbd5e1;font-size:14px}
        
        /* REPORT HEADER */
        .report-header{background:#1e293b;border:1px solid #334155;border-radius:8px;padding:20px;margin-bottom:20px;text-align:center}
        .report-header h2{color:#e2e8f0;margin-bottom:4px;font-size:16px}
        .report-header p{color:#94a3b8;font-size:11px;margin:2px 0}
        .report-meta{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:12px;text-align:left;font-size:11px}
        .report-meta .meta-item{color:#64748b}
        .report-meta .meta-val{color:#e2e8f0;font-weight:600}
        
        /* TABLES */
        table{width:100%;border-collapse:collapse;font-size:12px}
        table.report{margin-bottom:20px}
        th{background:#334155;padding:10px;text-align:left;font-weight:600;color:#cbd5e1;position:sticky;top:0;font-size:11px}
        td{padding:8px 10px;border-bottom:1px solid #1e293b}
        tr:hover td{background:#1e293b}
        .tbl-wrap{border:1px solid #334155;border-radius:6px;overflow:hidden;margin-bottom:16px}
        
        /* NUMERIC COLS */
        .text-right{text-align:right}
        .text-center{text-align:center}
        .num-val{font-family:'Courier New',monospace;color:#cbd5e1}
        .deudor{color:#fbbf24;font-weight:600}
        .acreedor{color:#60a5fa;font-weight:600}
        .positivo{color:#16a34a;font-weight:600}
        .negativo{color:#dc2626;font-weight:600}
        
        /* REPORT SUBTOTAL */
        .subtotal-row td{background:#334155;font-weight:600;color:#cbd5e1}
        .total-row td{background:#1e40af;font-weight:700;color:#fff}
        .section-break{height:20px;background:transparent}
        
        /* BALANCE GENERAL LAYOUT */
        .balance-container{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-bottom:20px}
        .balance-side{border:1px solid #334155;border-radius:8px;padding:16px;background:#1e293b}
        .balance-side h3{color:#e2e8f0;margin-bottom:12px;font-size:13px;border-bottom:2px solid #334155;padding-bottom:8px}
        .balance-item{display:flex;justify-content:space-between;padding:6px 0;color:#cbd5e1;font-size:12px}
        .balance-item-main{font-weight:600;color:#e2e8f0;padding:6px 0;border-top:1px solid #334155;margin-top:6px}
        .balance-item.child{padding-left:16px;color:#94a3b8}
        .balance-amount{font-family:'Courier New',monospace;text-align:right}
        
        /* ESTADO RESULTADOS */
        .er-section{margin-bottom:20px;background:#1e293b;border:1px solid #334155;border-radius:8px;padding:14px}
        .er-section-title{font-weight:700;color:#e2e8f0;padding-bottom:8px;border-bottom:1px solid #334155;margin-bottom:10px;font-size:12px}
        .er-line{display:flex;justify-content:space-between;padding:6px 0;font-size:12px}
        .er-line-label{color:#cbd5e1}
        .er-line-value{font-family:'Courier New',monospace;color:#cbd5e1;text-align:right}
        .er-line.total{border-top:1px solid #334155;padding-top:8px;margin-top:8px;font-weight:600;color:#e2e8f0}
        .er-line.result{background:#334155;padding:8px;border-radius:4px;margin-top:8px;font-weight:700;color:#f1f5f9}
        
        /* AUXILIAR */
        .cuenta-header{background:#334155;padding:10px;margin:14px 0 10px 0;border-radius:4px;font-weight:600;color:#cbd5e1;font-size:12px;border-left:3px solid #3b82f6}
        .mov-detail{display:grid;grid-template-columns:60px 80px 80px 1fr 80px 80px;gap:8px;padding:6px 0;font-size:11px;align-items:center}
        .mov-detail-label{color:#64748b;font-weight:600}
        
        /* CONTROLS */
        .controls{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
        .btn{padding:8px 14px;border:none;border-radius:5px;cursor:pointer;font-weight:600;font-size:12px;transition:all .15s}
        .btn-primary{background:#3b82f6;color:#fff}.btn-primary:hover{background:#2563eb}
        .btn-secondary{background:#475569;color:#e2e8f0}.btn-secondary:hover{background:#64748b}
        .btn-sm{padding:5px 10px;font-size:11px}
        
        /* FILTERS */
        .filter-group{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
        .filter-group label{margin-bottom:6px;display:block;font-size:11px;color:#94a3b8;font-weight:600}
        .filter-group input,.filter-group select{padding:6px 10px;background:#334155;border:1px solid #475569;border-radius:4px;color:#e2e8f0;font-size:12px;width:auto}
        
        /* PRINT */
        @media print{
            body{background:#fff;color:#000}
            .nav,.controls,.btn{display:none}
            .view{padding:0}
            .report-header h2{color:#000}
            h1{padding:0}
            table{font-size:11px}
            th{background:#ddd;color:#000}
            td{color:#000;border-color:#ccc}
            .tbl-wrap{border-color:#ccc}
        }
        
        /* UTILITY */
        .empty{text-align:center;color:#475569;padding:40px}
        .loading{color:#60a5fa}
        .msg{padding:10px 14px;border-radius:5px;margin-bottom:10px;display:none}
        .msg.show{display:block}
        .msg.success{background:#dcfce7;color:#166534}
        .msg.error{background:#fee2e2;color:#991b1b}
        .msg.info{background:#dbeafe;color:#1e40af}
        
        @media(max-width:768px){
            .balance-container{grid-template-columns:1fr}
            .mov-detail{grid-template-columns:1fr}
        }
    </style>
</head>
<body>

<h1>📊 SIF-Amir | Fase 3 <span style="color:#64748b;font-size:13px;font-weight:400">(Reportes Contables)</span></h1>
<p class="subtitle">Auxiliar · Balanza · Estados Financieros | NIF México 2026</p>

<div class="nav">
    <button class="nav-btn active" onclick="setView('auxiliar')">📕 Auxiliar Libro Mayor</button>
    <button class="nav-btn" onclick="setView('balanza')">⚖️ Balanza de Comprobación</button>
    <button class="nav-btn" onclick="setView('resultados')">📈 Estado de Resultados</button>
    <button class="nav-btn" onclick="setView('balance')">🏦 Balance General</button>
</div>

<!-- ===================== AUXILIAR DE LIBRO MAYOR ===================== -->
<div class="view active" id="view-auxiliar">
    <div id="msg-auxiliar" class="msg"></div>
    
    <div class="filter-group">
        <div>
            <label>Cuenta:</label>
            <select id="filter-auxiliar-cuenta" onchange="generarAuxiliar()">
                <option value="">-- Todas las Cuentas --</option>
            </select>
        </div>
        <div>
            <label>Periodo:</label>
            <input type="month" id="filter-auxiliar-periodo" value="2026-04" onchange="generarAuxiliar()">
        </div>
        <button class="btn btn-primary btn-sm" onclick="exportarAuxiliar('xlsx')">📥 Excel</button>
        <button class="btn btn-secondary btn-sm" onclick="exportarAuxiliar('pdf')">📄 PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <div id="auxiliar-report"></div>
</div>

<!-- ===================== BALANZA DE COMPROBACIÓN ===================== -->
<div class="view" id="view-balanza">
    <div id="msg-balanza" class="msg"></div>
    
    <div class="filter-group">
        <div>
            <label>Periodo:</label>
            <input type="month" id="filter-balanza-periodo" value="2026-04" onchange="generarBalanza()">
        </div>
        <button class="btn btn-primary btn-sm" onclick="exportarBalanza('xlsx')">📥 Excel</button>
        <button class="btn btn-secondary btn-sm" onclick="exportarBalanza('pdf')">📄 PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <div id="balanza-report"></div>
</div>

<!-- ===================== ESTADO DE RESULTADOS ===================== -->
<div class="view" id="view-resultados">
    <div id="msg-resultados" class="msg"></div>
    
    <div class="filter-group">
        <div>
            <label>Periodo:</label>
            <input type="month" id="filter-resultados-periodo" value="2026-04" onchange="generarResultados()">
        </div>
        <div>
            <label>Vista:</label>
            <select id="filter-resultados-vista" onchange="generarResultados()">
                <option value="periodo">Período Actual</option>
                <option value="acumulado">Acumulado</option>
                <option value="comparativo">Comparativo</option>
            </select>
        </div>
        <button class="btn btn-primary btn-sm" onclick="exportarResultados('xlsx')">📥 Excel</button>
        <button class="btn btn-secondary btn-sm" onclick="exportarResultados('pdf')">📄 PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <div id="resultados-report"></div>
</div>

<!-- ===================== BALANCE GENERAL ===================== -->
<div class="view" id="view-balance">
    <div id="msg-balance" class="msg"></div>
    
    <div class="filter-group">
        <div>
            <label>Fecha:</label>
            <input type="date" id="filter-balance-fecha" value="2026-04-30" onchange="generarBalance()">
        </div>
        <button class="btn btn-primary btn-sm" onclick="exportarBalance('xlsx')">📥 Excel</button>
        <button class="btn btn-secondary btn-sm" onclick="exportarBalance('pdf')">📄 PDF</button>
        <button class="btn btn-secondary btn-sm" onclick="window.print()">🖨️ Imprimir</button>
    </div>

    <div id="balance-report"></div>
</div>

<script>
    (function() {
        const APP_VERSION = '2026.08.14.1';
        const SUPABASE_URL = 'https://nzrzrbatcmzcmrmyrama.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_JMa-_sAXxw3LQrlqR7p7ww_RqLhY89X';
        
        let supabase = null;
        let datosAmir = {
            catalogo: [],
            polizas: [],
            polizasDetalles: []
        };
        
        async function inicializar() {
            try {
                supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
                
                await Promise.all([
                    cargarCatalogo(),
                    cargarPolizas(),
                    cargarPolizasDetalles()
                ]);
                
                actualizarFiltros();
                generarAuxiliar();
                
                mostrarMsg('auxiliar', 'Módulos cargados correctamente', 'success');
            } catch (e) {
                mostrarMsg('auxiliar', 'Error al inicializar: ' + e.message, 'error');
                console.error(e);
            }
        }
        
        async function cargarCatalogo() {
            const { data } = await supabase.from('amir_catalogo_cuentas').select('*');
            datosAmir.catalogo = data || [];
        }
        
        async function cargarPolizas() {
            const { data } = await supabase.from('amir_polizas').select('*');
            datosAmir.polizas = data || [];
        }
        
        async function cargarPolizasDetalles() {
            const { data } = await supabase.from('amir_polizas_detalles').select('*');
            datosAmir.polizasDetalles = data || [];
        }
        
        function actualizarFiltros() {
            const selectCuenta = document.getElementById('filter-auxiliar-cuenta');
            selectCuenta.innerHTML = '<option value="">-- Todas las Cuentas --</option>';
            
            datosAmir.catalogo
                .sort((a, b) => a.codigo.localeCompare(b.codigo))
                .forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id;
                    opt.textContent = `${c.codigo} - ${c.nombre}`;
                    selectCuenta.appendChild(opt);
                });
        }
        
        function generarAuxiliar() {
            const container = document.getElementById('auxiliar-report');
            const cuentaId = document.getElementById('filter-auxiliar-cuenta').value;
            const periodo = document.getElementById('filter-auxiliar-periodo').value;
            
            if (!periodo) {
                container.innerHTML = '<div class="empty">Selecciona un período</div>';
                return;
            }
            
            const [año, mes] = periodo.split('-');
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const mesNombre = meses[parseInt(mes) - 1];
            
            let filtradas = datosAmir.polizas.filter(p => {
                const pMes = new Date(p.fecha).toISOString().slice(0, 7);
                return pMes === periodo;
            });
            
            if (cuentaId) {
                const cuenta = datosAmir.catalogo.find(c => c.id == cuentaId);
                if (cuenta) {
                    filtradas = filtradas.filter(p => {
                        const detalles = datosAmir.polizasDetalles.filter(d => d.poliza_id === p.id);
                        return detalles.some(d => d.cuenta_id == cuentaId);
                    });
                }
            }
            
            const personaFisica = 'Amir Tafreshi';
            const rfc = 'TAAM810706S72';
            const direccion = 'Bellas Artes # 20181';
            const colonia = 'Ciudad Industrial, Tijuana, Baja California';
            
            let html = `
                <div class="report-header">
                    <h2>📕 AUXILIAR DEL LIBRO MAYOR</h2>
                    <p>CONTPAQ i | ${personaFisica}</p>
                    <p>Período: ${mesNombre} 01 - ${mes}/${año} 30, ${año}</p>
                    <p style="margin-top:8px;font-size:10px">RFC: ${rfc} | ${direccion} | ${colonia}</p>
                </div>
            `;
            
            if (cuentaId) {
                const cuenta = datosAmir.catalogo.find(c => c.id == cuentaId);
                html += `
                    <div class="cuenta-header">
                        ${cuenta.codigo} - ${cuenta.nombre}
                    </div>
                    <div class="tbl-wrap">
                        <table class="report">
                            <thead>
                                <tr>
                                    <th>Fecha</th>
                                    <th>Tipo</th>
                                    <th>Número</th>
                                    <th>Concepto</th>
                                    <th>Ref.</th>
                                    <th style="text-align:right">Cargos</th>
                                    <th style="text-align:right">Abonos</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                let totalCargos = 0, totalAbonos = 0;
                
                filtradas.forEach(p => {
                    const detalles = datosAmir.polizasDetalles.filter(d => d.poliza_id === p.id && d.cuenta_id == cuentaId);
                    detalles.forEach(d => {
                        const fecha = new Date(p.fecha).toLocaleDateString('es-MX');
                        const cargo = d.tipo_movimiento === 'cargo' ? d.monto : 0;
                        const abono = d.tipo_movimiento === 'abono' ? d.monto : 0;
                        totalCargos += cargo;
                        totalAbonos += abono;
                        
                        html += `
                            <tr>
                                <td>${fecha}</td>
                                <td>${p.tipo || '-'}</td>
                                <td>${p.numero || '-'}</td>
                                <td>${d.concepto || p.descripcion || '-'}</td>
                                <td>${p.referencia || '-'}</td>
                                <td class="text-right num-val">${cargo > 0 ? cargo.toFixed(2) : ''}</td>
                                <td class="text-right num-val">${abono > 0 ? abono.toFixed(2) : ''}</td>
                            </tr>
                        `;
                    });
                });
                
                html += `
                    <tr class="total-row">
                        <td colspan="5">TOTAL CUENTA</td>
                        <td class="text-right" style="color:#fff">${totalCargos.toFixed(2)}</td>
                        <td class="text-right" style="color:#fff">${totalAbonos.toFixed(2)}</td>
                    </tr>
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                const cuentasConMovimientos = [...new Set(datosAmir.polizasDetalles
                    .filter(d => filtradas.some(p => p.id === d.poliza_id))
                    .map(d => d.cuenta_id))];
                
                cuentasConMovimientos.forEach(ctaId => {
                    const cuenta = datosAmir.catalogo.find(c => c.id == ctaId);
                    if (!cuenta) return;
                    
                    html += `<div class="cuenta-header">${cuenta.codigo} - ${cuenta.nombre}</div>`;
                    html += `<div class="tbl-wrap"><table class="report"><thead><tr>
                        <th>Fecha</th><th>Tipo</th><th>Número</th><th>Concepto</th>
                        <th style="text-align:right">Cargos</th><th style="text-align:right">Abonos</th>
                    </tr></thead><tbody>`;
                    
                    let totalCargos = 0, totalAbonos = 0;
                    const detalles = datosAmir.polizasDetalles.filter(d => d.cuenta_id == ctaId && filtradas.some(p => p.id === d.poliza_id));
                    
                    detalles.forEach(d => {
                        const poliza = datosAmir.polizas.find(p => p.id === d.poliza_id);
                        const fecha = new Date(poliza.fecha).toLocaleDateString('es-MX');
                        const cargo = d.tipo_movimiento === 'cargo' ? d.monto : 0;
                        const abono = d.tipo_movimiento === 'abono' ? d.monto : 0;
                        totalCargos += cargo;
                        totalAbonos += abono;
                        
                        html += `<tr>
                            <td>${fecha}</td><td>${poliza.tipo || '-'}</td>
                            <td>${poliza.numero || '-'}</td><td>${d.concepto || '-'}</td>
                            <td class="text-right num-val">${cargo > 0 ? cargo.toFixed(2) : ''}</td>
                            <td class="text-right num-val">${abono > 0 ? abono.toFixed(2) : ''}</td>
                        </tr>`;
                    });
                    
                    html += `<tr class="subtotal-row">
                        <td colspan="4">SUBTOTAL</td>
                        <td class="text-right">${totalCargos.toFixed(2)}</td>
                        <td class="text-right">${totalAbonos.toFixed(2)}</td>
                    </tr></tbody></table></div>`;
                });
            }
            
            container.innerHTML = html;
        }
        
        function generarBalanza() {
            const container = document.getElementById('balanza-report');
            const periodo = document.getElementById('filter-balanza-periodo').value;
            
            if (!periodo) {
                container.innerHTML = '<div class="empty">Selecciona un período</div>';
                return;
            }
            
            const [año, mes] = periodo.split('-');
            const meses = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
            const mesNombre = meses[parseInt(mes) - 1];
            
            let html = `
                <div class="report-header">
                    <h2>⚖️ BALANZA DE COMPROBACIÓN</h2>
                    <p>CONTPAQ i | Amir Tafreshi</p>
                    <p>Al ${mes}/${año}</p>
                </div>
                <div class="tbl-wrap">
                    <table class="report">
                        <thead>
                            <tr>
                                <th>Cuenta</th>
                                <th>Nombre</th>
                                <th style="text-align:right">Saldo Inicial Deudor</th>
                                <th style="text-align:right">Saldo Inicial Acreedor</th>
                                <th style="text-align:right">Cargos</th>
                                <th style="text-align:right">Abonos</th>
                                <th style="text-align:right">Saldo Final Deudor</th>
                                <th style="text-align:right">Saldo Final Acreedor</th>
                            </tr>
                        </thead>
                        <tbody>
            `;
            
            let sumDeudorIni = 0, sumAcreedorIni = 0, sumCargos = 0, sumAbonos = 0, sumDeudorFin = 0, sumAcreedorFin = 0;
            
            datosAmir.catalogo.sort((a, b) => a.codigo.localeCompare(b.codigo)).forEach(c => {
                const detalles = datosAmir.polizasDetalles.filter(d => {
                    const p = datosAmir.polizas.find(pol => pol.id === d.poliza_id);
                    return d.cuenta_id === c.id && p && new Date(p.fecha).toISOString().slice(0, 7) === periodo;
                });
                
                const cargos = detalles.filter(d => d.tipo_movimiento === 'cargo').reduce((s, d) => s + d.monto, 0);
                const abonos = detalles.filter(d => d.tipo_movimiento === 'abono').reduce((s, d) => s + d.monto, 0);
                
                const saldoIniDeudor = c.saldo_inicial > 0 ? c.saldo_inicial : 0;
                const saldoIniAcreedor = c.saldo_inicial < 0 ? Math.abs(c.saldo_inicial) : 0;
                const saldoFinal = saldoIniDeudor - saldoIniAcreedor + cargos - abonos;
                const saldoFinDeudor = saldoFinal > 0 ? saldoFinal : 0;
                const saldoFinAcreedor = saldoFinal < 0 ? Math.abs(saldoFinal) : 0;
                
                sumDeudorIni += saldoIniDeudor;
                sumAcreedorIni += saldoIniAcreedor;
                sumCargos += cargos;
                sumAbonos += abonos;
                sumDeudorFin += saldoFinDeudor;
                sumAcreedorFin += saldoFinAcreedor;
                
                html += `<tr>
                    <td>${c.codigo}</td>
                    <td>${c.nombre}</td>
                    <td class="text-right num-val">${saldoIniDeudor > 0 ? saldoIniDeudor.toFixed(2) : ''}</td>
                    <td class="text-right num-val">${saldoIniAcreedor > 0 ? saldoIniAcreedor.toFixed(2) : ''}</td>
                    <td class="text-right num-val">${cargos > 0 ? cargos.toFixed(2) : ''}</td>
                    <td class="text-right num-val">${abonos > 0 ? abonos.toFixed(2) : ''}</td>
                    <td class="text-right num-val">${saldoFinDeudor > 0 ? saldoFinDeudor.toFixed(2) : ''}</td>
                    <td class="text-right num-val">${saldoFinAcreedor > 0 ? saldoFinAcreedor.toFixed(2) : ''}</td>
                </tr>`;
            });
            
            html += `
                        <tr class="total-row">
                            <td colspan="2">SUMAS IGUALES</td>
                            <td class="text-right" style="color:#fff">${sumDeudorIni.toFixed(2)}</td>
                            <td class="text-right" style="color:#fff">${sumAcreedorIni.toFixed(2)}</td>
                            <td class="text-right" style="color:#fff">${sumCargos.toFixed(2)}</td>
                            <td class="text-right" style="color:#fff">${sumAbonos.toFixed(2)}</td>
                            <td class="text-right" style="color:#fff">${sumDeudorFin.toFixed(2)}</td>
                            <td class="text-right" style="color:#fff">${sumAcreedorFin.toFixed(2)}</td>
                        </tr>
                    </tbody>
                    </table>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function generarResultados() {
            const container = document.getElementById('resultados-report');
            const periodo = document.getElementById('filter-resultados-periodo').value;
            
            if (!periodo) {
                container.innerHTML = '<div class="empty">Selecciona un período</div>';
                return;
            }
            
            const [año, mes] = periodo.split('-');
            
            let html = `
                <div class="report-header">
                    <h2>📈 ESTADO DE RESULTADOS</h2>
                    <p>CONTPAQ i | Amir Tafreshi</p>
                    <p>Del 01/${mes}/${año} al ${new Date(año, mes, 0).getDate()}/${mes}/${año}</p>
                </div>
            `;
            
            const ingresos = datosAmir.catalogo.filter(c => c.tipo === 'ingreso');
            const costos = datosAmir.catalogo.filter(c => c.tipo === 'costo');
            const gastos = datosAmir.catalogo.filter(c => c.tipo === 'gasto');
            const financiero = datosAmir.catalogo.filter(c => c.tipo === 'financiero');
            
            let totalIngreso = 0, totalCosto = 0, totalGasto = 0, totalFinanciero = 0;
            
            const calcularMonto = (ctaId) => {
                return datosAmir.polizasDetalles.filter(d => {
                    const p = datosAmir.polizas.find(pol => pol.id === d.poliza_id);
                    return d.cuenta_id === ctaId && p && new Date(p.fecha).toISOString().slice(0, 7) === periodo;
                }).reduce((s, d) => s + (d.tipo_movimiento === 'cargo' ? d.monto : -d.monto), 0);
            };
            
            html += '<div class="er-section">';
            html += '<div class="er-section-title">INGRESOS</div>';
            ingresos.forEach(c => {
                const monto = calcularMonto(c.id);
                totalIngreso += monto;
                html += `<div class="er-line">
                    <span class="er-line-label">${c.nombre}</span>
                    <span class="er-line-value">${monto.toFixed(2)}</span>
                </div>`;
            });
            html += `<div class="er-line total">
                <span>Total Ingresos</span>
                <span>${totalIngreso.toFixed(2)}</span>
            </div></div>`;
            
            html += '<div class="er-section">';
            html += '<div class="er-section-title">COSTOS</div>';
            costos.forEach(c => {
                const monto = calcularMonto(c.id);
                totalCosto += monto;
                html += `<div class="er-line">
                    <span class="er-line-label">${c.nombre}</span>
                    <span class="er-line-value">${monto.toFixed(2)}</span>
                </div>`;
            });
            const utilidadBruta = totalIngreso - totalCosto;
            html += `<div class="er-line total">
                <span>Total Costos</span>
                <span>${totalCosto.toFixed(2)}</span>
            </div>
            <div class="er-line total" style="background:#334155">
                <span>Utilidad Bruta</span>
                <span>${utilidadBruta.toFixed(2)}</span>
            </div></div>`;
            
            html += '<div class="er-section">';
            html += '<div class="er-section-title">GASTOS</div>';
            gastos.forEach(c => {
                const monto = calcularMonto(c.id);
                totalGasto += monto;
                html += `<div class="er-line">
                    <span class="er-line-label">${c.nombre}</span>
                    <span class="er-line-value">${monto.toFixed(2)}</span>
                </div>`;
            });
            html += `<div class="er-line total">
                <span>Total Gastos</span>
                <span>${totalGasto.toFixed(2)}</span>
            </div></div>`;
            
            html += '<div class="er-section">';
            html += '<div class="er-section-title">RESULTADO INTEGRAL DE FINANCIAMIENTO</div>';
            financiero.forEach(c => {
                const monto = calcularMonto(c.id);
                totalFinanciero += monto;
                html += `<div class="er-line">
                    <span class="er-line-label">${c.nombre}</span>
                    <span class="er-line-value">${monto.toFixed(2)}</span>
                </div>`;
            });
            html += `<div class="er-line total">
                <span>Total Financiero</span>
                <span>${totalFinanciero.toFixed(2)}</span>
            </div></div>`;
            
            const resultadoNeto = utilidadBruta - totalGasto + totalFinanciero;
            html += `
                <div class="er-section">
                    <div class="er-line result">
                        <span>${resultadoNeto >= 0 ? '✓ UTILIDAD DEL EJERCICIO' : '✗ PÉRDIDA DEL EJERCICIO'}</span>
                        <span class="${resultadoNeto >= 0 ? 'positivo' : 'negativo'}">${resultadoNeto.toFixed(2)}</span>
                    </div>
                </div>
            `;
            
            container.innerHTML = html;
        }
        
        function generarBalance() {
            const container = document.getElementById('balance-report');
            const fecha = document.getElementById('filter-balance-fecha').value;
            
            if (!fecha) {
                container.innerHTML = '<div class="empty">Selecciona una fecha</div>';
                return;
            }
            
            let html = `
                <div class="report-header">
                    <h2>🏦 POSICIÓN FINANCIERA - BALANCE GENERAL</h2>
                    <p>CONTPAQ i | Amir Tafreshi</p>
                    <p>Al ${new Date(fecha).toLocaleDateString('es-MX')}</p>
                </div>
            `;
            
            const activos = datosAmir.catalogo.filter(c => c.tipo === 'activo');
            const pasivos = datosAmir.catalogo.filter(c => c.tipo === 'pasivo');
            const capital = datosAmir.catalogo.filter(c => c.tipo === 'capital');
            
            const calcularSaldo = (ctaId) => {
                const inicial = datosAmir.catalogo.find(c => c.id === ctaId)?.saldo_inicial || 0;
                const movimientos = datosAmir.polizasDetalles.filter(d => {
                    const p = datosAmir.polizas.find(pol => pol.id === d.poliza_id);
                    return d.cuenta_id === ctaId && p && new Date(p.fecha) <= new Date(fecha);
                }).reduce((s, d) => s + (d.tipo_movimiento === 'cargo' ? d.monto : -d.monto), 0);
                return inicial + movimientos;
            };
            
            html += '<div class="balance-container">';
            
            // ACTIVOS
            html += '<div class="balance-side">';
            html += '<h3>ACTIVO</h3>';
            let totalActivos = 0;
            activos.forEach(c => {
                const saldo = calcularSaldo(c.id);
                totalActivos += saldo;
                html += `<div class="balance-item child">
                    <span>${c.nombre}</span>
                    <span class="balance-amount">${saldo.toFixed(2)}</span>
                </div>`;
            });
            html += `<div class="balance-item-main">
                <span>TOTAL ACTIVO</span>
                <span class="balance-amount">${totalActivos.toFixed(2)}</span>
            </div>`;
            html += '</div>';
            
            // PASIVO + CAPITAL
            html += '<div class="balance-side">';
            html += '<h3>PASIVO</h3>';
            let totalPasivos = 0;
            pasivos.forEach(c => {
                const saldo = calcularSaldo(c.id);
                totalPasivos += Math.abs(saldo);
                html += `<div class="balance-item child">
                    <span>${c.nombre}</span>
                    <span class="balance-amount">${Math.abs(saldo).toFixed(2)}</span>
                </div>`;
            });
            html += `<div class="balance-item-main">
                <span>TOTAL PASIVO</span>
                <span class="balance-amount">${totalPasivos.toFixed(2)}</span>
            </div>`;
            
            html += '<h3 style="margin-top:16px">CAPITAL</h3>';
            let totalCapital = 0;
            capital.forEach(c => {
                const saldo = calcularSaldo(c.id);
                totalCapital += saldo;
                html += `<div class="balance-item child">
                    <span>${c.nombre}</span>
                    <span class="balance-amount">${saldo.toFixed(2)}</span>
                </div>`;
            });
            html += `<div class="balance-item-main">
                <span>TOTAL CAPITAL</span>
                <span class="balance-amount">${totalCapital.toFixed(2)}</span>
            </div>`;
            
            const sumaPyC = totalPasivos + totalCapital;
            html += `<div class="balance-item-main" style="margin-top:8px;border-top:2px solid #475569">
                <span>SUMA PASIVO + CAPITAL</span>
                <span class="balance-amount">${sumaPyC.toFixed(2)}</span>
            </div>`;
            
            html += '</div></div>';
            
            container.innerHTML = html;
        }
        
        function exportarAuxiliar(tipo) {
            const periodo = document.getElementById('filter-auxiliar-periodo').value;
            const nombreArchivo = `Auxiliar_Libro_Mayor_${periodo}.${tipo === 'xlsx' ? 'xlsx' : 'pdf'}`;
            mostrarMsg('auxiliar', `Exportando a ${tipo.toUpperCase()}...`, 'info');
        }
        
        function exportarBalanza(tipo) {
            const periodo = document.getElementById('filter-balanza-periodo').value;
            const nombreArchivo = `Balanza_Comprobacion_${periodo}.${tipo === 'xlsx' ? 'xlsx' : 'pdf'}`;
            mostrarMsg('balanza', `Exportando a ${tipo.toUpperCase()}...`, 'info');
        }
        
        function exportarResultados(tipo) {
            const periodo = document.getElementById('filter-resultados-periodo').value;
            const nombreArchivo = `Estado_Resultados_${periodo}.${tipo === 'xlsx' ? 'xlsx' : 'pdf'}`;
            mostrarMsg('resultados', `Exportando a ${tipo.toUpperCase()}...`, 'info');
        }
        
        function exportarBalance(tipo) {
            const fecha = document.getElementById('filter-balance-fecha').value;
            const nombreArchivo = `Balance_General_${fecha}.${tipo === 'xlsx' ? 'xlsx' : 'pdf'}`;
            mostrarMsg('balance', `Exportando a ${tipo.toUpperCase()}...`, 'info');
        }
        
        function setView(viewName) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('view-' + viewName).classList.add('active');
            
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            
            if (viewName === 'auxiliar') generarAuxiliar();
            else if (viewName === 'balanza') generarBalanza();
            else if (viewName === 'resultados') generarResultados();
            else if (viewName === 'balance') generarBalance();
        }
        
        function mostrarMsg(view, texto, tipo) {
            const msg = document.getElementById(`msg-${view}`);
            if (msg) {
                msg.textContent = texto;
                msg.className = `msg show ${tipo}`;
                if (tipo === 'success') setTimeout(() => msg.classList.remove('show'), 3000);
            }
        }
        
        // Inicializar al cargar
        window.addEventListener('load', inicializar);
        
        // Export functions globales
        window.generarAuxiliar = generarAuxiliar;
        window.generarBalanza = generarBalanza;
        window.generarResultados = generarResultados;
        window.generarBalance = generarBalance;
        window.exportarAuxiliar = exportarAuxiliar;
        window.exportarBalanza = exportarBalanza;
        window.exportarResultados = exportarResultados;
        window.exportarBalance = exportarBalance;
        window.setView = setView;
        window.mostrarMsg = mostrarMsg;
    })();
</script>

</body>
</html>
