            if(n < 0) return 'num-negative';
            if(n === 0) return 'num-zero';

        function formatNumber(n) {
            if(n === 0 || n === null || n === undefined) return '-';
            const sign = n < 0 ? '-' : '';
            const abs = Math.abs(n);
            return sign + abs.toLocaleString('es-MX', {minimumFractionDigits: 0, maximumFractionDigits: 0});
        }

        function llenarSelectAuxiliar() {
            const sel = document.getElementById('filter-auxiliar-cuenta');
            CATALOGO.filter(c => c.acepta_mov && (c.tipo === 'activo' || c.tipo === 'pasivo' || c.tipo === 'ingreso' || c.tipo === 'costo' || c.tipo === 'gasto' || c.tipo === 'rif')).forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id;
                opt.text = `${c.codigo} ${c.nombre}`;
                sel.appendChild(opt);
            });
        }

            `;

        function exportarAuxiliar() {

        // ===== REPORTE BALANZA DE COMPROBACIÓN =====
        function generarBalanza() {
            const cont = document.getElementById('balanza-report');
            const per = document.getElementById('filter-balanza-periodo').value;
            
            if(!per) { cont.innerHTML = '<div class="empty">Selecciona período</div>'; return; }
            
            const [año, mes] = per.split('-');
            const ultDia = new Date(año, parseInt(mes), 0).toISOString().split('T')[0];
            
            let html = `
                <div class="report-header">
                    <h2>⚖️ BALANZA DE COMPROBACIÓN</h2>
                    <p>Del 01/${mes}/${año} al ${ultDia}</p>
                </div>
                
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Nombre Cuenta</th>
                            <th>S.I. Deudor</th>
                            <th>S.I. Acreedor</th>
                            <th>Cargos</th>
                            <th>Abonos</th>
                            <th>S.F. Deudor</th>
                            <th>S.F. Acreedor</th>
                        </tr>
                    </thead>
                    <tbody>
            `;
            
            let sumDeuIni = 0, sumAcrIni = 0, sumCargo = 0, sumAbono = 0, sumDeuFin = 0, sumAcrFin = 0;
            
            CATALOGO.filter(c => c.acepta_mov).forEach(c => {
                const saldoIni = getSaldoInicial(c.id);
                const movs = POLIZAS_DETALLES.filter(d => {
                    const p = POLIZAS.find(pol => pol.id === d.poliza_id);
                    return d.cuenta_id === c.id && p && new Date(p.fecha).toISOString().slice(0, 7) === per;
                });
                
                let cargo = 0, abono = 0;
                movs.forEach(d => {
                    if(d.tipo_movimiento === 'cargo') cargo += d.monto;
                    else abono += d.monto;
                });
                
                const saldoFin = saldoIni + cargo - abono;
                
                const siDeu = saldoIni > 0 ? saldoIni : 0;
                const siAcr = saldoIni < 0 ? Math.abs(saldoIni) : 0;
                const sfDeu = saldoFin > 0 ? saldoFin : 0;
                const sfAcr = saldoFin < 0 ? Math.abs(saldoFin) : 0;
                
                sumDeuIni += siDeu;
                sumAcrIni += siAcr;
                sumCargo += cargo;
                sumAbono += abono;
                sumDeuFin += sfDeu;
                sumAcrFin += sfAcr;
                
                html += `<tr>
                    <td>${c.codigo}</td>
                    <td>${c.nombre}</td>
                    <td class="num">${formatNumber(siDeu)}</td>
                    <td class="num">${formatNumber(siAcr)}</td>
                    <td class="num">${formatNumber(cargo)}</td>
                    <td class="num">${formatNumber(abono)}</td>
                    <td class="num">${formatNumber(sfDeu)}</td>
                    <td class="num">${formatNumber(sfAcr)}</td>
                </tr>`;
            });
            
            html += `<tr class="total-row">
                <td colspan="2">SUMAS IGUALES</td>
                <td class="num ${numberClass(sumDeuIni)}">${formatNumber(sumDeuIni)}</td>
                <td class="num ${numberClass(sumAcrIni)}">${formatNumber(sumAcrIni)}</td>
                <td class="num ${numberClass(sumCargo)}">${formatNumber(sumCargo)}</td>
                <td class="num ${numberClass(sumAbono)}">${formatNumber(sumAbono)}</td>
                <td class="num ${numberClass(sumDeuFin)}">${formatNumber(sumDeuFin)}</td>
                <td class="num ${numberClass(sumAcrFin)}">${formatNumber(sumAcrFin)}</td>
            </tr></tbody></table>`;
            
            cont.innerHTML = html;
        }
        
        function exportarBalanza() {
            const ws = XLSX.utils.aoa_to_sheet([['Balanza', document.getElementById('filter-balanza-periodo').value]]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Balanza');
            XLSX.writeFile(wb, 'Balanza.xlsx');
        }
        
        // ===== ESTADO DE RESULTADOS (NIF B-3) =====
        function generarResultados() {
            const cont = document.getElementById('resultados-report');
            const per = document.getElementById('filter-resultados-periodo').value;
            
            if(!per) { cont.innerHTML = '<div class="empty">Selecciona período</div>'; return; }
            
            const [año, mes] = per.split('-');
            
            // Cálculos por tipo de cuenta
            const calcMto = (ctaIds) => {
                return POLIZAS_DETALLES.filter(d => {
                    const p = POLIZAS.find(pol => pol.id === d.poliza_id);
                    return ctaIds.includes(d.cuenta_id) && p && new Date(p.fecha).toISOString().slice(0, 7) === per;
                }).reduce((s, d) => s + (d.tipo_movimiento === 'cargo' ? d.monto : -d.monto), 0);
            };
            
            // INGRESOS (cuenta 28: Ingresos Servicios)
            const ingresos = calcMto([28]);
            
            // COSTOS (cuenta 31: Costo Consumibles)
            const costos = calcMto([31]);
            
            // GASTOS DE VENTA (cuenta 34: Publicidad)
            const gstVenta = calcMto([34]);
            
            // GASTOS DE ADMINISTRACIÓN (cuentas 36, 37)
            const gstAdmin = calcMto([36, 37]);
            
            // GASTOS FINANCIEROS (cuenta 40: Intereses)
            const gstFin = calcMto([40]);
            
            // PRODUCTOS FINANCIEROS (cuenta 42: Intereses Ganados)
            const prodFin = calcMto([42]);
            
            // Cálculos cascada NIF B-3
            const utilBruta = ingresos - costos;
            const utilOper = utilBruta - gstVenta - gstAdmin;
            const rif = -gstFin + prodFin;
            const utilAntesImpuestos = utilOper + rif;
            
            let html = `
                <div class="report-header">
                    <h2>📈 ESTADO DE RESULTADOS INTEGRAL</h2>
                    <p>Del 01/${mes}/${año} al 30/${mes}/${año} | NIF B-3</p>
                </div>
                
                <div class="section">
                    <div class="section-title">I. INGRESOS</div>
                    <div class="section-line">
                        <span class="section-line-label">Ingresos por Servicios</span>
                        <span class="section-line-value num ${numberClass(ingresos)}">${formatNumber(ingresos)}</span>
                    </div>
                    <div class="section-line" style="font-weight:600;color:#1e293b;border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px">
                        <span>Total Ingresos</span>
                        <span class="section-line-value num ${numberClass(ingresos)}">${formatNumber(ingresos)}</span>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">II. COSTOS</div>
                    <div class="section-line">
                        <span class="section-line-label">Costo de Servicios (Consumibles)</span>
                        <span class="section-line-value num ${numberClass(costos)}">${formatNumber(costos)}</span>
                    </div>
                    <div class="section-line" style="font-weight:600;color:#1e293b;border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px">
                        <span>Total Costos</span>
                        <span class="section-line-value num ${numberClass(costos)}">${formatNumber(costos)}</span>
                    </div>
                    <div class="section-line" style="font-weight:600;color:#1e40af;padding-top:8px;margin-top:4px">
                        <span>UTILIDAD BRUTA</span>
                        <span class="section-line-value num ${numberClass(utilBruta)}">${formatNumber(utilBruta)}</span>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">III. GASTOS OPERATIVOS</div>
                    <div class="section-line">
                        <span class="section-line-label">Gastos de Venta</span>
                        <span class="section-line-value num ${numberClass(gstVenta)}">${formatNumber(gstVenta)}</span>
                    </div>
                    <div class="section-line">
                        <span class="section-line-label">Gastos de Administración</span>
                        <span class="section-line-value num ${numberClass(gstAdmin)}">${formatNumber(gstAdmin)}</span>
                    </div>
                    <div class="section-line" style="font-weight:600;color:#1e293b;border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px">
                        <span>Total Gastos Operativos</span>
                        <span class="section-line-value num ${numberClass(gstVenta + gstAdmin)}">${formatNumber(gstVenta + gstAdmin)}</span>
                    </div>
                    <div class="section-line" style="font-weight:600;color:#1e40af;padding-top:8px;margin-top:4px">
                        <span>UTILIDAD DE OPERACIÓN</span>
                        <span class="section-line-value num ${numberClass(utilOper)}">${formatNumber(utilOper)}</span>
                    </div>
                </div>
                
                <div class="section">
                    <div class="section-title">IV. RESULTADO INTEGRAL DE FINANCIAMIENTO</div>
                    <div class="section-line">
                        <span class="section-line-label">Gastos Financieros</span>
                        <span class="section-line-value num ${numberClass(gstFin)}">${formatNumber(gstFin)}</span>
                    </div>
                    <div class="section-line">
                        <span class="section-line-label">Productos Financieros</span>
                        <span class="section-line-value num ${numberClass(prodFin)}">${formatNumber(prodFin)}</span>
                    </div>
                    <div class="section-line" style="font-weight:600;color:#1e293b;border-top:1px solid #e2e8f0;padding-top:8px;margin-top:8px">
                        <span>Total RIF</span>
                        <span class="section-line-value num ${numberClass(rif)}">${formatNumber(rif)}</span>
                    </div>
                </div>
                
                <div class="section" style="background:#1e40af;color:#fff;border-color:#1e40af">
                    <div style="display:flex;justify-content:space-between;font-weight:700;font-size:13px">
                        <span>${utilAntesImpuestos >= 0 ? '✓ UTILIDAD DEL EJERCICIO' : '✗ PÉRDIDA DEL EJERCICIO'}</span>
                        <span class="${numberClass(utilAntesImpuestos)}">${formatNumber(utilAntesImpuestos)}</span>
                    </div>
                </div>
            `;
            
            cont.innerHTML = html;
        }
        
        function exportarResultados() {
            const ws = XLSX.utils.aoa_to_sheet([['Resultados', document.getElementById('filter-resultados-periodo').value]]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Resultados');
            XLSX.writeFile(wb, 'Resultados.xlsx');
        }
        
        // ===== BALANCE GENERAL (NIF B-6 - Incluye Traspaso de ER) =====
        function generarBalance() {
            const cont = document.getElementById('balance-report');
            const fec = document.getElementById('filter-balance-fecha').value;
            
            if(!fec) { cont.innerHTML = '<div class="empty">Selecciona fecha</div>'; return; }
            
            // Calcular resultado acumulado del año
            const ultDiaAno = new Date(new Date(fec).getFullYear(), 11, 31).toISOString().split('T')[0];
            const periodoHastaFecha = new Date(fec).toISOString().slice(0, 7);
            
            const calcMtoHastaFecha = (ctaIds) => {
                return POLIZAS_DETALLES.filter(d => {
                    const p = POLIZAS.find(pol => pol.id === d.poliza_id);
                    return ctaIds.includes(d.cuenta_id) && p && new Date(p.fecha) <= new Date(fec);
                }).reduce((s, d) => s + (d.tipo_movimiento === 'cargo' ? d.monto : -d.monto), 0);
            };
            
            const ingresos = calcMtoHastaFecha([28]);
            const costos = calcMtoHastaFecha([31]);
            const gstVenta = calcMtoHastaFecha([34]);
            const gstAdmin = calcMtoHastaFecha([36, 37]);
            const gstFin = calcMtoHastaFecha([40]);
            const prodFin = calcMtoHastaFecha([42]);
            
            const utilBruta = ingresos - costos;
            const utilOper = utilBruta - gstVenta - gstAdmin;
            const rif = -gstFin + prodFin;
            const resultadoEjercicio = utilOper + rif; // ⭐ TRASPASO A BALANCE
            
            const calcSaldo = (ctaId) => {
                const ini = getSaldoInicial(ctaId);
                const movs = POLIZAS_DETALLES.filter(d => {
                    const p = POLIZAS.find(pol => pol.id === d.poliza_id);
                    return d.cuenta_id === ctaId && p && new Date(p.fecha) <= new Date(fec);
                }).reduce((s, d) => s + (d.tipo_movimiento === 'cargo' ? d.monto : -d.monto), 0);
                return ini + movs;
            };
            
            let html = `
                <div class="report-header">
                    <h2>🏦 POSICIÓN FINANCIERA - BALANCE GENERAL</h2>
                    <p>Al ${new Date(fec).toLocaleDateString('es-MX')} | NIF B-6</p>
                </div>
                
                <div class="balance-container">
                    <div class="balance-side">
                        <h3>ACTIVO</h3>
            `;
            
            let totAct = 0;
            const cuentasActivo = [5, 6, 8, 10, 13, 15];
            cuentasActivo.forEach(ctaId => {
                const saldo = calcSaldo(ctaId);
                const cta = CATALOGO.find(c => c.id === ctaId);
                if(Math.abs(saldo) > 0.01) {
                    totAct += saldo;
                    html += `<div class="balance-item child">
                        <span>${cta.nombre}</span>
                        <span class="balance-amount num ${numberClass(saldo)}">${formatNumber(saldo)}</span>
                    </div>`;
                }
            });
            
            html += `<div class="balance-total balance-item">
                        <span>TOTAL ACTIVO</span>
                        <span class="balance-amount num ${numberClass(totAct)}">${formatNumber(totAct)}</span>
                    </div>
                    </div>
                    
                    <div class="balance-side">
                        <h3>PASIVO</h3>
            `;
            
            let totPas = 0;
            const cuentasPasivo = [18, 20];
            cuentasPasivo.forEach(ctaId => {
                const saldo = Math.abs(calcSaldo(ctaId));
                const cta = CATALOGO.find(c => c.id === ctaId);
                if(saldo > 0.01) {
                    totPas += saldo;
                    html += `<div class="balance-item child">
                        <span>${cta.nombre}</span>
                        <span class="balance-amount num">${formatNumber(saldo)}</span>
                    </div>`;
                }
            });
            
            html += `<div class="balance-total balance-item">
                        <span>TOTAL PASIVO</span>
                        <span class="balance-amount num">${formatNumber(totPas)}</span>
                    </div>
                    
                    <h3 style="margin-top:20px">CAPITAL CONTABLE</h3>
            `;
            
            let totCap = 0;
            const cuentasCapital = [23];
            cuentasCapital.forEach(ctaId => {
                const saldo = Math.abs(calcSaldo(ctaId));
                const cta = CATALOGO.find(c => c.id === ctaId);
                if(saldo > 0.01) {
                    totCap += saldo;
                    html += `<div class="balance-item child">
                        <span>${cta.nombre}</span>
                        <span class="balance-amount num">${formatNumber(saldo)}</span>
                    </div>`;
                }
            });
            
            // TRASPASO DE RESULTADO DEL EJERCICIO (NIF B-6)
            totCap += resultadoEjercicio;
            html += `<div class="balance-item child" style="background:#e0f2fe;padding:8px;margin:8px 0;border-radius:4px;border-left:3px solid #0284c7">
                        <span style="font-weight:600">⭐ Resultado del Ejercicio (Traspaso ER)</span>
                        <span class="balance-amount num ${numberClass(resultadoEjercicio)}">${formatNumber(resultadoEjercicio)}</span>
                    </div>`;
            
            html += `<div class="balance-total balance-item">
                        <span>TOTAL CAPITAL</span>
                        <span class="balance-amount num ${numberClass(totCap)}">${formatNumber(totCap)}</span>
                    </div>
                    
                    <div class="balance-total balance-item" style="margin-top:12px;padding-top:12px;border-top:2px solid #e2e8f0">
                        <span>SUMA PASIVO + CAPITAL</span>
                        <span class="balance-amount num ${numberClass(totPas + totCap)}">${formatNumber(totPas + totCap)}</span>
                    </div>
                    </div>
                </div>
                
                <div class="section" style="background:#f0fdf4;border-left-color:#22c55e">
                    <div style="font-weight:600;font-size:12px;color:#166534">
                        ${totAct.toFixed(2) === (totPas + totCap).toFixed(2) ? '✓ BALANCE CUADRADO' : '❌ BALANCE NO CUADRA'}
                    </div>
                </div>
            `;
            
            cont.innerHTML = html;
        }
        
        function exportarBalance() {
            const ws = XLSX.utils.aoa_to_sheet([['Balance', document.getElementById('filter-balance-fecha').value]]);
            const wb = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(wb, ws, 'Balance');
            XLSX.writeFile(wb, 'Balance.xlsx');
        }
        
        // ===== NAVEGACIÓN =====
        function setView(v) {
            document.querySelectorAll('.view').forEach(el => el.classList.remove('active'));
            document.getElementById('view-' + v).classList.add('active');
            document.querySelectorAll('.nav-btn').forEach(el => el.classList.remove('active'));
            event.target.classList.add('active');
            
            if(v === 'auxiliar') generarAuxiliar();
            else if(v === 'balanza') generarBalanza();
            else if(v === 'resultados') generarResultados();
            else if(v === 'balance') generarBalance();
        }
        
        // ===== INICIALIZACIÓN =====
        window.addEventListener('DOMContentLoaded', () => {
            llenarSelectAuxiliar();
            generarAuxiliar();
        });
        
        window.generarAuxiliar = generarAuxiliar;
        window.exportarAuxiliar = exportarAuxiliar;
        window.generarBalanza = generarBalanza;
        window.exportarBalanza = exportarBalanza;
        window.generarResultados = generarResultados;
        window.exportarResultados = exportarResultados;
        window.generarBalance = generarBalance;
        window.exportarBalance = exportarBalance;
        window.setView = setView;
    </script>
