<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIF-Amir | Persona Física</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f172a; color: #e2e8f0; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        h1 { margin-bottom: 20px; color: #f1f5f9; }
        .card { background: #1e293b; border: 1px solid #334155; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        label { display: block; margin-top: 12px; margin-bottom: 4px; font-weight: 600; color: #cbd5e1; }
        input[type="file"], button { padding: 10px 16px; border-radius: 6px; border: none; cursor: pointer; font-size: 14px; margin-top: 8px; }
        input[type="file"] { background: #334155; color: #e2e8f0; width: 100%; }
        button { background: #3b82f6; color: white; font-weight: 600; }
        button:hover { background: #2563eb; }
        .success { background: #dcfce7; color: #166534; padding: 12px; border-radius: 6px; margin-top: 12px; }
        .error { background: #fee2e2; color: #991b1b; padding: 12px; border-radius: 6px; margin-top: 12px; }
        .loading { background: #dbeafe; color: #1e40af; padding: 12px; border-radius: 6px; margin-top: 12px; }
        table { width: 100%; border-collapse: collapse; margin-top: 12px; }
        th, td { padding: 8px; text-align: left; border-bottom: 1px solid #334155; }
        th { background: #334155; font-weight: 600; }
        .hidden { display: none; }
        .version { text-align: center; color: #64748b; font-size: 12px; margin-top: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 SIF-Amir (Persona Física)</h1>
        
        <div class="card">
            <h2>📤 Cargar Facturas → Generar Pólizas</h2>
            <p style="color: #94a3b8; margin: 12px 0; font-size: 14px;">Carga archivo Excel de facturas recibidas. Se generarán pólizas automáticas según NIF México 2026.</p>
            
            <label>Seleccionar archivo Excel:</label>
            <input type="file" id="excelFile" accept=".xlsx,.xls">
            
            <button onclick="procesarExcel()">▶ Procesar y Generar Pólizas</button>
            
            <div id="status"></div>
            <div id="preview" class="hidden" style="margin-top: 20px;">
                <h3 style="margin-bottom: 12px;">✓ Pólizas generadas:</h3>
                <div id="previewContent"></div>
            </div>
        </div>
    </div>

    <div class="version">v2026.08.13.6</div>

    <script>
        const supabaseUrl = 'https://nzrzrbatcmzcmrmyrama.supabase.co';
        const supabaseKey = 'sb_publishable_JMa-_sAXxw3LQrlqR7p7ww_RqLhY89X';
        const { createClient } = window.supabase;
        const supabase = createClient(supabaseUrl, supabaseKey);

        async function procesarExcel() {
            const file = document.getElementById('excelFile').files[0];
            if (!file) {
                mostrarError('❌ Selecciona un archivo Excel');
                return;
            }

            mostrarCargando('Leyendo Excel...');

            try {
                const arrayBuffer = await file.arrayBuffer();
                const workbook = XLSX.read(arrayBuffer, { type: 'array' });
                const ws = workbook.Sheets[workbook.SheetNames[0]];
                const datos = XLSX.utils.sheet_to_json(ws);

                console.log('Datos leídos:', datos);

                const polizas = [];
                
                datos.forEach((row, idx) => {
                    // Validar que tenga fecha y total
                    const fecha = row['▼ Fecha Comprobante'];
                    const total = parseFloat(row['Total']);
                    const emisor = row['Nombre Emisor'];
                    const folio = row['Folio'];

                    if (!fecha || !total || !emisor) {
                        console.log(`Fila ${idx + 2} saltada (datos incompletos)`);
                        return;
                    }

                    // Convertir fecha Excel a string
                    let fechaStr = fecha;
                    if (typeof fecha === 'number') {
                        const d = new Date((fecha - 25569) * 86400 * 1000);
                        fechaStr = d.toISOString().split('T')[0];
                    } else if (typeof fecha === 'string') {
                        fechaStr = fecha.split('T')[0];
                    }

                    // Calcular subtotal e IVA
                    const subtotal = total / 1.16;
                    const iva = total - subtotal;

                    const poliza = {
                        fecha: fechaStr,
                        tipo_poliza: 'Egreso',
                        concepto: `COMPRA - ${folio} - ${emisor}`,
                        detalles: [
                            { cuenta: '501-01-000', debe: subtotal, haber: 0 },
                            { cuenta: '201-01-000', debe: 0, haber: total }
                        ]
                    };

                    if (iva > 0.01) {
                        poliza.detalles.push({
                            cuenta: '118-01-000',
                            debe: iva,
                            haber: 0
                        });
                    }

                    polizas.push(poliza);
                });

                if (polizas.length === 0) {
                    mostrarError('❌ No se encontraron facturas válidas en el Excel');
                    return;
                }

                console.log(`Pólizas generadas: ${polizas.length}`);
                mostrarPreview(polizas);
                
                mostrarCargando(`Guardando ${polizas.length} pólizas en Supabase...`);
                const resultados = await guardarPolizas(polizas);
                
                const exitosas = resultados.filter(r => r.ok).length;
                mostrarExito(`✓ ${exitosas}/${polizas.length} pólizas creadas en Supabase`);

            } catch (err) {
                console.error('Error:', err);
                mostrarError(`❌ Error: ${err.message}`);
            }
        }

        async function guardarPolizas(polizas) {
            const resultados = [];

            for (const poliza of polizas) {
                try {
                    // 1. Insertar póliza
                    const { data: polizaData, error: polizaError } = await supabase
                        .from('amir_polizas')
                        .insert([{
                            fecha: poliza.fecha,
                            tipo_poliza: poliza.tipo_poliza,
                            concepto: poliza.concepto
                        }])
                        .select();

                    if (polizaError) {
                        throw new Error(`Póliza: ${polizaError.message}`);
                    }

                    const polizaId = polizaData[0].id;
                    console.log(`Póliza creada: ${polizaId}`);

                    // 2. Insertar detalles
                    for (const detalle of poliza.detalles) {
                        // Buscar cuenta
                        const { data: cuentaData, error: cuentaError } = await supabase
                            .from('amir_catalogo_cuentas')
                            .select('id')
                            .eq('codigo', detalle.cuenta)
                            .single();

                        if (cuentaError) {
                            console.warn(`Cuenta ${detalle.cuenta} no encontrada`);
                            continue;
                        }

                        // Insertar detalle
                        const { error: detalleError } = await supabase
                            .from('amir_polizas_detalles')
                            .insert([{
                                poliza_id: polizaId,
                                cuenta_id: cuentaData.id,
                                debe: detalle.debe,
                                haber: detalle.haber
                            }]);

                        if (detalleError) {
                            throw new Error(`Detalle: ${detalleError.message}`);
                        }
                    }

                    resultados.push({ ok: true });

                } catch (err) {
                    console.error(`Error guardando póliza:`, err);
                    resultados.push({ ok: false, error: err.message });
                }
            }

            return resultados;
        }

        function mostrarPreview(polizas) {
            let html = '<table><thead><tr><th>Fecha</th><th>Tipo</th><th>Concepto</th><th>Renglones</th></tr></thead><tbody>';
            polizas.forEach(p => {
                html += `<tr><td>${p.fecha}</td><td>${p.tipo_poliza}</td><td>${p.concepto}</td><td>${p.detalles.length}</td></tr>`;
            });
            html += '</tbody></table>';
            
            document.getElementById('previewContent').innerHTML = html;
            document.getElementById('preview').classList.remove('hidden');
        }

        function mostrarCargando(msg) {
            document.getElementById('status').innerHTML = `<div class="loading">${msg}</div>`;
        }

        function mostrarExito(msg) {
            document.getElementById('status').innerHTML = `<div class="success">${msg}</div>`;
        }

        function mostrarError(msg) {
            document.getElementById('status').innerHTML = `<div class="error">${msg}</div>`;
        }
    </script>
</body>
</html>
